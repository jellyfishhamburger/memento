<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEMENTO — 让照片变成一本作品集</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="mark" aria-hidden="true">M</span>
    <span class="wordmark">MEMENTO</span>
  </div>
  <input id="titleInput" class="title-input" value="十一月的海" aria-label="作品标题" spellcheck="false">
  <div class="bar-spacer"></div>
  <span id="statLine" class="stat">还没有照片</span>
  <button id="btnImport" class="btn btn-ghost">导入照片</button>
  <button id="btnPDF" class="btn btn-ghost" disabled>导出 PDF</button>
  <button id="btnPNG" class="btn btn-primary" disabled>导出九张</button>
</header>

<main class="shell">
  <aside class="rail">
    <section class="rail-block">
      <h2 class="rail-title">排版模式</h2>
      <div id="modes" class="opt-list"></div>
    </section>

    <section class="rail-block">
      <h2 class="rail-title">方案</h2>
      <div id="schemes" class="opt-list opt-list--tight"></div>
    </section>

    <section class="rail-block">
      <h2 class="rail-title">张数</h2>
      <div id="counts" class="seg" role="group" aria-label="张数">
        <button type="button" data-count="9">九张</button>
        <button type="button" data-count="11">十一张</button>
      </div>
      <p id="countNote" class="rail-note">九张 = 封面 + 四页/四跨页：朋友圈九图正好。</p>
    </section>

    <section class="rail-block">
      <h2 class="rail-title">照片</h2>
      <p class="rail-note">点一张删掉（可撤销）。</p>
      <div id="tray" class="tray"></div>
    </section>

    <div class="rail-foot">
      <button id="btnShuffle" class="btn btn-primary btn-wide" disabled>换一版编排</button>
    </div>
  </aside>

  <section class="stage">
    <div id="empty" class="empty">
      <p class="empty-kicker">四十张照片，一本小书</p>
      <h1 class="empty-title">把照片扔进来</h1>
      <p class="empty-sub">本地处理，不上传。每张按原画幅落位，两页一组排成跨页；横图会跨过中缝，滑过去连成一整张。</p>
      <div class="empty-actions">
        <button class="btn btn-primary" id="btnPick">选择照片</button>
        <button class="btn btn-ghost" id="btnDemo">先用示例照片看看</button>
      </div>
    </div>

    <div id="zinePanel" class="zine-panel" hidden>
      <div class="zine-head">
        <h1 class="grid-title">作品集</h1>
        <p id="zineNote" class="grid-note"></p>
      </div>
      <div id="zineList" class="zine-list"></div>
      <p class="stage-hint">点任意一张照片：换图 / 删图 / 拖动调整显示的部分。点页面空白处放大看。</p>
    </div>
  </section>
</main>

<div id="picker" class="picker" hidden>
  <div class="picker-card" role="dialog" aria-label="换一张">
    <div class="picker-head" id="pickerHead">
      <div>
        <h2 id="pickerTitle" class="picker-title">换一张</h2>
        <p id="pickerNote" class="picker-note"></p>
      </div>
      <button id="pickerClose" class="picker-close" aria-label="关闭">✕</button>
    </div>
    <div id="pickerCrop" class="picker-crop" hidden>
      <div id="cropBox" class="crop-box"></div>
      <p class="crop-hint">左右上下拖动，选这一段显示。</p>
    </div>
    <div id="pickerGrid" class="picker-grid"></div>
  </div>
</div>

<div id="lightbox" class="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="关闭">✕</button>
  <div class="lb-nav">
    <button id="lbPrev" aria-label="上一页">‹</button>
    <span id="lbCount"></span>
    <button id="lbNext" aria-label="下一页">›</button>
  </div>
  <div id="lbStage" class="lb-stage"></div>
</div>

<input type="file" id="fileInput" accept="image/*" multiple hidden>
<div id="toast" class="toast" hidden></div>

<script src="js/analyze.js"></script>
<script src="js/engine.js"></script>
<script src="js/spread.js"></script>
<script src="js/compose.js"></script>
<script src="js/render.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
